ext.jar_budget_bytes = 1536L * 1024   // 1.5 MB hard ceiling for the engine

loom {
    // No access widener needed for Phase 1; add here if a later phase requires one.
    splitEnvironmentSourceSets()   // client code physically separated: src/client/java

    // Remap mixin targets directly in the bytecode at remapJar time instead of via refmap files.
    // (With split source sets the legacy AP wrote client mappings to a second refmap that the release jar
    //  did not reference, which crashed real launchers while the dev environment worked.)
    mixin {
        useLegacyMixinAp = false
    }

    mods {
        animecore {
            sourceSet sourceSets.main
            sourceSet sourceSets.client
        }
    }
}

fabricApi {
    configureDataGeneration {
        client = true
        modId = 'animecore'   // only this mod's providers write into this project's src/main/generated
    }
}

// configureDataGeneration() already registers src/main/generated as a resource dir.
processResources { exclude '.cache/**' }
